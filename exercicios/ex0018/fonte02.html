<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Cyber';
            src: url('cyber_brush_2') format('embedded-opentype');
            font-weight: normal;
            font-style: normal;
            
            /*
            Tipos de formt()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Cyber', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1> 
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sapiente modi nobis quasi, facilis est nesciunt aut, magni quas dignissimos ducimus eius minus, dicta necessitatibus dolores impedit harum dolorem. Doloribus, reprehenderit?</p>  
</body>
</html>
